<!-- Modèle « Confirm signup » (premier lien reçu par un nouveau compte).
     Objet conseillé : Bienvenue sur Vadrouille — confirme ton adresse -->
<div style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #18323d; background: #faf6ef; border-radius: 16px;">
  <h1 style="font-size: 22px; margin: 0 0 8px;">🧭 Bienvenue sur Vadrouille !</h1>
  <p style="font-size: 16px;">Confirme ton adresse pour rejoindre tes compagnons de voyage :</p>
  <p style="text-align: center; margin: 28px 0;">
    <a href="{{ .ConfirmationURL }}" style="background: #ef7b62; color: #ffffff; padding: 14px 24px; border-radius: 999px; text-decoration: none; font-weight: bold; font-size: 16px;">Confirmer et me connecter</a>
  </p>
  <p style="font-size: 14px;">Ou saisis ce code dans l’app :</p>
  <p style="font-size: 28px; font-weight: bold; letter-spacing: 6px; text-align: center; font-family: monospace;">{{ .Token }}</p>
</div>
